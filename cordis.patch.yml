# dsh-subagent-vision bundle patch.
#
# Adds `subagent_vision`: a second subagent delegation tool whose children are
# routed to a vision-capable model. A text-only main agent (DeepSeek) delegates
# image reading to that child and merges the child's text result back into the
# same session — no model switching, no second session, no copy-paste.
#
# The tool is implemented by this package (`tool.js`) on the public
# `ctx.subagents` / `ctx.tools` seams, so the patch inserts exactly one row and
# references no other package beyond this one. The same row also mounts the
# host plugin half (guide prompt section + vision route settings section +
# paste-to-path route), and the browser half (client.js) loads through the
# package's `dsh.client` manifest, so pasting an image while a text-only model
# is current stores the bytes as a private temp file and inserts the path into
# the composer instead of tripping image admission.
#
# This file is the durable store for the vision route: when the user picks a
# model in Settings > 视觉处理模型, the host plugin (index.js) rewrites this
# row's `config.visionTool.agentOptions` to that choice, so the tool starts
# with it on the next boot even if the live settings->config sync cannot apply
# it at runtime. Clearing the choice removes the block again. This file is
# plugin-owned: hand edits to the row survive until the next settings change.
#
# The block below is the current baseline: `qwen` is the provider id
# llm-pi-ai registers for this deployment (`llm.providers` confirms it; the
# older `pi-ai` id does not resolve here).
- insert:
    # Tool + host plugin + browser roster entry in one row. The `visionTool`
    # block configures the `subagent_vision` tool mounted by this package's
    # tool half (tool.js): `provider` names the ctx.subagents provider to
    # delegate through, and `agentOptions` pins the child's LLM route.
    - id: subagent-vision
      name: 'dsh-subagent-vision'
      config:
        visionTool:
          provider: spawn
          agentOptions:
            provider: qwen
            model: qwen3.8-max
            maxTokens: 16384
