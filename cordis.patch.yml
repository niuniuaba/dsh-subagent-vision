# dsh-subagent-vision bundle patch (0.2.x port).
#
# Adds `subagent_vision`: a subagent delegation tool whose children are routed
# to a vision-capable model. A text-only main agent delegates image reading to
# that child and the child's text result comes back as a settlement notice in
# the same session.
#
# The tool is implemented by this package (tool.js) on the public
# ctx.subagents / ctx.tools seams; the patch inserts exactly one row. The row
# also mounts the host plugin half (guide prompt section).
#
# The `visionTool.agentOptions` block pins the child's LLM route. Edit the
# provider/model here to point at a vision-capable model your deployment has.
- insert:
    - id: subagent-vision
      name: 'dsh-subagent-vision'
      config:
        visionTool:
          provider: spawn
          agentOptions:
            provider: polza
            model: deepseek/deepseek-v4.1-flash-1017
            maxTokens: 16384
